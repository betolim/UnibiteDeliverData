        run: |
          set -euo pipefail
          mkdir -p project
          printf '%s' "$NATIVE_SOURCE_B64" | base64 --decode > native-source.zip
          unzip -q native-source.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle
          grep -q 'versionName "2.1-native"' project/app/build.gradle
          grep -q 'Tap a color. No color code is required.' project/app/src/main/java/net/unibitefoods/deliverdata/MainActivity.java
          grep -q '525600' project/app/src/main/java/net/unibitefoods/deliverdata/MainActivity.java
          grep -q 'Forgot password?' project/app/src/main/java/net/unibitefoods/deliverdata/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s project/app/build/outputs/apk/debug/app-debug.apk
          sha256sum project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: UnibiteDeliverData-Native-v2.1-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
