        run: |
          set -euo pipefail
          mkdir -p android-project
          printf '%s' "$ANDROID_SOURCE_B64" | base64 --decode > android-source.zip
          unzip -q android-source.zip -d android-project
          test -f android-project/settings.gradle
          test -f android-project/app/src/main/AndroidManifest.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK
        run: |
          test -s android-project/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-project/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Unibite-Repacking-Platform-Debug-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
