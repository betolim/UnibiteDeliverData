        run: |
          set -euo pipefail
          mkdir -p project
          printf '%s' "$NATIVE_SOURCE_B64" | base64 --decode > native-source.zip
          unzip -q native-source.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle
          grep -q 'versionName "2.3-native"' project/app/build.gradle
          grep -q 'Confirm Daily Check' project/app/src/main/java/net/unibitefoods/deliverdata/MainActivity.java
          grep -q 'Weekly Report' project/app/src/main/java/net/unibitefoods/deliverdata/MainActivity.java
          grep -q 'Admin · Customers' project/app/src/main/java/net/unibitefoods/deliverdata/MainActivity.java
          grep -q 'Daily Check Reminder' project/app/src/main/java/net/unibitefoods/deliverdata/MainActivity.java
          grep -q 'work-runtime:2.9.1' project/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s project/app/build/outputs/apk/debug/app-debug.apk
          sha256sum project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: UnibiteDeliverData-Native-v2.3-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
