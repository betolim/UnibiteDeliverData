        run: |
          set -euo pipefail
          mkdir project
          printf '%s' "$NATIVE_SOURCE_B64" | base64 --decode > native.zip
          unzip -q native.zip -d project
          test -f project/app/src/main/java/net/unibitefoods/deliverdata/MainActivity.java
          test -f project/app/src/main/java/net/unibitefoods/deliverdata/ApiClient.java
          if grep -R "android.webkit.WebView" project/app/src/main; then
            echo "WebView detected; native build rejected"
            exit 1
          fi
          grep -R "mobile_api.php" project/app/src/main/java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: UnibiteDeliverData-Native-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
